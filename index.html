<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Peña Los Secatis</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2420;--mu:#66716a;--ac:#1f7a4d;--bd:#dfe4de;--bad:#b3402f;--warn:#a86a10;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a16;--card:#1d2520;--tx:#e8eee9;--mu:#98a49c;--ac:#4cc38a;--bd:#2c3730;--bad:#e5806f;--warn:#e0b25a}}
:root[data-theme="dark"]{--bg:#141a16;--card:#1d2520;--tx:#e8eee9;--mu:#98a49c;--ac:#4cc38a;--bd:#2c3730;--bad:#e5806f;--warn:#e0b25a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
nav button{flex:1;white-space:nowrap}
button,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
button{cursor:pointer}
button.on,button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.del{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.big{font-size:34px;font-weight:700;color:var(--ac)}.neg{color:var(--bad)}.mu{color:var(--mu);font-size:13px}.warn{color:var(--warn)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.f{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:10px}
.f label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
.f input{width:110px}.f input.w{width:170px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{padding:4px 10px;border-radius:999px;font-size:13px}
.s1{border-color:var(--warn);color:var(--warn)}.s2{background:var(--ac);border-color:var(--ac);color:#fff}.s0{color:var(--mu)}
.chip.gy{border-color:#c99a0c;color:#8a6200}
.chip.gy.s2{background:#f2c230;border-color:#c99a0c;color:#2b2100}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.gy{color:#f2c230;border-color:#b8921a}:root:not([data-theme="light"]) .chip.gy.s2{color:#2b2100}}
:root[data-theme="dark"] .chip.gy{color:#f2c230;border-color:#b8921a}:root[data-theme="dark"] .chip.gy.s2{color:#2b2100}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:520px){.cols{grid-template-columns:1fr}}
.tm{border-radius:12px;padding:12px;border:1px solid}
.tm.n{background:#1f1f1f;color:#f2f2f2;border-color:#555}
.tm.b{background:#f6f6f6;color:#161616;border-color:#cfcfcf}
.tm button{background:transparent;color:inherit;border-color:currentColor;padding:3px 8px;font-size:13px}
.tm .row{border-color:rgba(128,128,128,.35)}
.tm .mu{color:inherit;opacity:.7}
details>summary{cursor:pointer;padding:4px 0}
.tk:disabled{cursor:default}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin:6px 0}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;background:var(--bd)}
.upl{display:inline-block;cursor:pointer;border:1px dashed var(--ac);color:var(--ac);border-radius:8px;padding:6px 12px;margin-top:4px}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;box-sizing:border-box}
#lb img{max-width:100%;max-height:76vh;border-radius:8px}
#lb button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.lbx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.lbn{display:flex;align-items:center;gap:12px;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kpi{border:1px solid var(--bd);border-radius:10px;padding:8px 10px}.kpi b{display:block;font-size:20px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;border:1px solid var(--bd);margin:4px 0}.bar i{display:block;height:100%}
.st h4{margin:14px 0 2px;font-size:14px}
.pitch{position:relative;width:100%;aspect-ratio:105/68;border-radius:12px;overflow:hidden;margin-top:12px;background:repeating-linear-gradient(90deg,#2e8b4f 0 9.5%,#2a8048 9.5% 19%)}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.pl{position:absolute;top:6px;font-size:12px;font-weight:600;color:#fff;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:999px}
.pl.l{left:8px}.pl.r{right:8px}
.tk{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent!important;border:0!important;padding:0;cursor:pointer}
.tk i{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font:700 13px system-ui,sans-serif}
.tk.tn i{background:#151515;color:#fff}.tk.tb i{background:#fafafa;color:#151515;border-color:#333}
.tk span{font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 2px #000;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk.on2 i{outline:3px solid #f2c230}
@media(max-width:520px){.tk i{width:24px;height:24px;font-size:11px}.tk span{font-size:10px;max-width:50px}}
textarea{width:100%;height:110px;box-sizing:border-box;font:12px monospace}
</style></head><body><main>
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px"><h1 style="margin:0">⚽ Peña Los Secatis</h1><button id="lg" onclick="login()"></button></div>
<nav id="nav"></nav>
<div id="st" class="mu" style="margin-bottom:10px"></div>
<div id="lb" style="display:none"></div>
<div id="v"><p class="mu">Cargando…</p></div>
</main>
<script>
const K="pena-cuentas-v1";
let S={cfg:{cuota:10,campo:60,precio:6,precioNS:8},players:[],matches:[],moves:[]},tab="res",cf=null,msg="";
let RO=true,tm=null,PW=null,err="";
const post=b=>fetch("api.php",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
const save=()=>{clearTimeout(tm);if(RO)return;tm=setTimeout(async()=>{try{const r=await post({pass:PW,data:JSON.stringify(S)});if(r.status==401){RO=true;PW=null;tab="res";try{sessionStorage.removeItem("pw")}catch(e){}err="Contraseña no válida: sesión de editor cerrada.";R()}else if(!r.ok){err="No se pudo guardar en el NAS.";R()}else if(err){err="";R()}}catch(e){err="Sin conexión con el NAS: cambios sin guardar.";R()}},300)};
async function load(force){try{const r=await fetch("api.php?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();if(j&&j.data&&(force||JSON.stringify(j.data)!==JSON.stringify(S))){S=j.data;return true}}catch(e){}return false}
async function tryLogin(p){try{const r=await post({pass:p,check:1});if(r.ok){PW=p;RO=false;err="";try{sessionStorage.setItem("pw",p)}catch(e){}await load(true)}else{err="Contraseña incorrecta."}}catch(e){err="Sin conexión con el NAS."}R()}
function login(){if(!RO){RO=true;PW=null;tab="res";err="";try{sessionStorage.removeItem("pw")}catch(e){}load(true).then(R);return}const p=prompt("Contraseña de editor:");if(p)tryLogin(p)}
const $=s=>document.querySelector(s);
const eur=n=>new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(n||0);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>{const[y,m,x]=d.split("-");return x+"/"+m+"/"+y};
const TABS=[["res","Resumen"],["rsl","Resultados"],["pho","Fotos"],["con","Convocatoria"],["jug","Socios"],["par","Pagos"],["mov","Gastos"],["set","Ajustes"]];
const LBL=["—","Pendiente","Pagó"];
const pr=(m,k)=>m.pr&&m.pr[k]!=null?m.pr[k]:m.precio;
function ms(m){let pay=0,pen=0,col=0;for(const k in m.st){if(m.st[k]==2){pay++;col+=pr(m,k)}else if(m.st[k]==1)pen++}return{pay,pen,col,sur:col-m.coste}}
function debts(){const d={};S.players.forEach(p=>d[p.id]={c:0,p:0,j:0});
 S.matches.forEach(m=>{for(const k in m.st){if(!d[k]){if((m.ext||[]).some(e=>e.id==k))d[k]={c:0,p:0,j:0};else continue}if(m.st[k]>=1)d[k].j++;if(m.st[k]==1)d[k].p+=pr(m,k)}});return d}
function totals(){const ini=S.players.reduce((a,p)=>a+(p.paid||0),0),sur=S.matches.reduce((a,m)=>a+(m.closed?ms(m).sur:0),0),oth=S.moves.reduce((a,x)=>a+x.amt,0);
 const d=debts();let pen=0;for(const k in d)pen+=d[k].c+d[k].p;const alq=S.matches.filter(m=>!m.closed).reduce((a,m)=>a+(+m.coste||0),0);return{ini,sur,oth,pen,alq,fund:ini+sur+oth-alq}}
function conf(k){if(cf===k){cf=null;return true}cf=k;R();return false}
const bt=(k,t)=>cf===k?"¿Seguro?":t;
function addP(){const n=$("#pn").value.trim();if(!n)return;S.players.push({id:uid(),name:n,paid:$("#pp").checked?S.cfg.cuota:0,fecha:$("#pp").checked?($("#pf").value||today()):""});save();R()}
function togP(id){const p=S.players.find(x=>x.id==id);p.paid=p.paid?0:S.cfg.cuota;p.fecha=p.paid?today():"";save();R()}
function setF(id,v){const p=S.players.find(x=>x.id==id);p.fecha=v;save()}
let cw={};
let cv=null,sp=null;
let PH=[],PHB=null,pmsg="",LB=null,dpc=null;
let OP={};
function tgD(el,k){OP[k]=el.open}
function pastH(m){
 const pl=pool(m),nm=id=>(pl.find(q=>q.id==id)||{name:"?"}).name,mxn=mx(m),cap=Math.ceil(mxn/2);
 const cf=(m.conf||[]).filter(id=>pl.some(q=>q.id==id)),tit=cf.slice(0,mxn),res=cf.slice(mxn),eq=m.eq||{};
 if(!cf.length)return'<p class="mu">Este partido no tiene convocatoria registrada.</p>';
 const N=tit.filter(k=>eq[k]=="N"),B=tit.filter(k=>eq[k]=="B"),S0=tit.filter(k=>!eq[k]),ls=a=>a.map(k=>esc(nm(k))).join(", ");
 return `${m.sc?`<div style="text-align:center;font-size:22px;font-weight:700;margin:8px 0">⬛ ${m.sc.n} – ${m.sc.b} ⬜</div>`:""}${pitchH(m,N,B,cap,nm,true)}<div class="mu" style="margin-top:6px">Convocados (${tit.length}): ${ls(tit)}${S0.length?`<br>Sin equipo: ${ls(S0)}`:""}${res.length?`<br>Reserva: ${ls(res)}`:""}</div><div style="margin:8px 0"><button class="sel" onclick="exportImg('${m.id}')">📷 Exportar imagen</button></div>`}
const fdm=p=>{const m=S.matches.find(x=>x.id==p.m);return m?fd(m.date):""};
function lb(id){LB=id;dpc=null;lbR()}
function lbR(){const o=$("#lb"),p=PH.find(x=>x.id==LB);if(!p){o.style.display="none";o.innerHTML="";return}
 const L=PH.filter(x=>x.m==p.m).sort((a,b)=>a.t-b.t),i=Math.max(0,L.findIndex(x=>x.id==p.id));
 o.innerHTML=`<button class="lbx" onclick="lb(null)">✕</button><img src="${p.url}" alt="Foto del partido"><div class="lbn"><button onclick="lb('${L[(i-1+L.length)%L.length].id}')">‹</button><span>${fdm(p)} · ${i+1}/${L.length}</span><button onclick="lb('${L[(i+1)%L.length].id}')">›</button>${PHB&&PHB.canDel?`<button onclick="delPh('${p.id}')">${dpc==p.id?"¿Seguro?":"🗑"}</button>`:""}</div>`;o.style.display="flex"}
async function delPh(id){if(dpc!=id){dpc=id;lbR();return}dpc=null;const p=PH.find(x=>x.id==id);if(!p||!PHB)return;const nx=PH.filter(x=>x.m==p.m&&x.id!=id)[0];try{await PHB.del(p);PH=PH.filter(x=>x.id!=id);pmsg=""}catch(e){pmsg="No se pudo borrar la foto."}LB=nx?nx.id:null;try{await PHB.load()}catch(e){}R();lbR()}
async function resizeImg(f,max=1600){try{const bm=await createImageBitmap(f),k=Math.min(1,max/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));if(b)return b}catch(e){}if(f.size>8e6)throw new Error("la imagen es demasiado grande");return f}
async function upl(mid,inp){const f=inp.files&&inp.files[0];inp.value="";if(!f||!PHB)return;pmsg="Subiendo foto…";R();try{const b=await resizeImg(f);await PHB.up(b,mid);pmsg=""}catch(e){pmsg="No se pudo subir la foto"+(e&&e.message?": "+e.message:".")}try{await PHB.load()}catch(e){}R()}
function phTab(){
 const up=mid=>PHB&&PHB.canUp?`<div><label class="upl">➕ Subir foto<input type="file" accept="image/*" hidden onchange="upl('${mid}',this)"></label></div>`:"";
 const g=l=>`<div class="gal">${l.map(p=>`<img src="${p.url}" loading="lazy" onclick="lb('${p.id}')" alt="Foto del partido">`).join("")}</div>`;
 const nf=n=>n+" foto"+(n==1?"":"s");
 const ms=[...S.matches].sort((a,b)=>b.date.localeCompare(a.date)).filter(m=>PH.some(p=>p.m==m.id)||(PHB&&PHB.canUp));
 const orph=PH.filter(p=>!S.matches.some(m=>m.id==p.m)).sort((a,b)=>a.t-b.t);
 let o=`<div class="mu" style="margin-bottom:8px">${nf(PH.length)} · agrupadas por partido</div>${pmsg?`<div class="warn" style="margin-bottom:8px">${esc(pmsg)}</div>`:""}`;
 ms.forEach(m=>{const l=PH.filter(p=>p.m==m.id).sort((a,b)=>a.t-b.t);o+=`<div class="card"><div class="row"><b>${fd(m.date)}${m.closed?" · ✓ Cerrado":""}</b><span class="mu">${m.sc?"⬛ "+m.sc.n+"–"+m.sc.b+" ⬜ · ":""}${nf(l.length)}</span></div>${l.length?g(l):'<p class="mu">Sin fotos todavía.</p>'}${up(m.id)}</div>`});
 if(orph.length)o+=`<div class="card"><div class="row"><b>Partido eliminado</b><span class="mu">${nf(orph.length)}</span></div>${g(orph)}</div>`;
 if(!ms.length&&!orph.length)o+='<div class="card"><p class="mu">Todavía no hay partidos con fotos.</p></div>';
 return o}
function setSc(mid,k,v){const M=S.matches.find(q=>q.id==mid);M.sc=M.sc||{n:0,b:0};M.sc[k]=Math.max(0,Math.round(+v)||0);save();R()}
function delSc(mid){const M=S.matches.find(q=>q.id==mid);if(!conf("sc"+mid))return;delete M.sc;delete M.gol;save();R()}
function goal(mid,id,d){const M=S.matches.find(q=>q.id==mid);M.gol=M.gol||{};const n=Math.max(0,(M.gol[id]||0)+d);if(n)M.gol[id]=n;else delete M.gol[id];save();R()}
function statsH(){
 const L=S.matches.filter(m=>m.sc).sort((a,b)=>a.date.localeCompare(b.date));
 if(!L.length)return`<div class="card"><b>Estadísticas</b><p class="mu">Cuando guardes el primer resultado aparecerán aquí las estadísticas.</p></div>`;
 const P={},who=(m,id)=>{const p=S.players.find(q=>q.id==id);if(p)return{k:id,n:p.name};const e=(m.ext||[]).find(q=>q.id==id);const n=e?e.name:"?";return{k:"i:"+n,n:n+" (inv.)"}};
 const get=w=>P[w.k]||(P[w.k]={n:w.n,g:0,pj:0,w:0,d:0,l:0});
 let gt=0,wn=0,wb=0,dr=0,big=null,most=null,hat=null;
 L.forEach(m=>{const a=m.sc.n,b=m.sc.b,tg=a+b;gt+=tg;const win=a>b?"N":b>a?"B":"D";if(win=="N")wn++;else if(win=="B")wb++;else dr++;
  if(!big||Math.abs(a-b)>big.d)big={d:Math.abs(a-b),m};
  if(!most||tg>most.t)most={t:tg,m};
  Object.entries(m.gol||{}).forEach(([id,n])=>{const p=get(who(m,id));p.g+=n;if(!hat||n>hat.n)hat={n,p:p.n,m}});
  Object.entries(m.eq||{}).forEach(([id,t])=>{const p=get(who(m,id));p.pj++;if(win=="D")p.d++;else if(win==t)p.w++;else p.l++})});
 const arr=Object.values(P),tot=L.length;
 const top=(f,s,n)=>arr.filter(f).sort(s).slice(0,n);
 const sg=top(p=>p.g>0,(a,b)=>b.g-a.g||a.n.localeCompare(b.n),5);
 const sw=top(p=>p.w>0,(a,b)=>b.w-a.w||b.w/b.pj-a.w/a.pj||a.n.localeCompare(b.n),5);
 const spj=top(p=>p.pj>0,(a,b)=>b.pj-a.pj||a.n.localeCompare(b.n),3);
 const pct=top(p=>p.pj>=2,(a,b)=>b.w/b.pj-a.w/a.pj||b.pj-a.pj,3);
 const ties=(l,k)=>l.filter(p=>p[k]==l[0][k]).map(p=>p.n).join(", ");
 const li=(l,f)=>l.map((p,i)=>`<div class="row"><span>${i+1}. ${esc(p.n)}</span><b>${f(p)}</b></div>`).join("");
 const nn=(n,s,p)=>n+" "+(n==1?s:p),pc=n=>n/tot*100,sc=m=>fd(m.date)+" ("+m.sc.n+"–"+m.sc.b+")";
 const kp=(t,v)=>`<div class="kpi"><span class="mu">${t}</span><b>${v}</b></div>`;
 const noEq='<p class="mu">Asigna equipos en Convocatoria para calcular esto.</p>';
 return `<div class="card st"><b>Estadísticas</b>
 <div class="kpis" style="margin-top:8px">${kp("Partidos",tot)}${kp("Goles",gt)}${kp("Goles por partido",(gt/tot).toFixed(1).replace(".",","))}</div>
 <h4>¿Qué camiseta gana más?</h4>
 <div class="bar"><i style="width:${pc(wn)}%;background:#151515"></i><i style="width:${pc(dr)}%;background:#9aa39d"></i><i style="width:${pc(wb)}%;background:#fafafa"></i></div>
 <div class="row"><span>⬛ Camiseta negra</span><b>${nn(wn,"victoria","victorias")}</b></div><div class="row"><span>⬜ Camiseta blanca</span><b>${nn(wb,"victoria","victorias")}</b></div><div class="row"><span>Empates</span><b>${dr}</b></div>
 <h4>🥇 Máximo goleador</h4>${sg.length?`<p style="margin:2px 0"><b>${esc(ties(sg,"g"))}</b> · ${nn(sg[0].g,"gol","goles")}</p>${li(sg,p=>nn(p.g,"gol","goles"))}`:'<p class="mu">Aún no hay goleadores registrados.</p>'}
 <h4>🏆 Más victorias individuales</h4>${sw.length?`<p style="margin:2px 0"><b>${esc(ties(sw,"w"))}</b> · ${nn(sw[0].w,"victoria","victorias")}</p>${li(sw,p=>p.w+" V de "+p.pj)}`:(arr.some(p=>p.pj>0)?'<p class="mu">Aún no hay victorias registradas.</p>':noEq)}
 <h4>Más datos</h4>
 <div class="row"><span>Mayor goleada</span><b>${big.d?sc(big.m):"—"}</b></div>
 <div class="row"><span>Partido con más goles</span><b>${sc(most.m)}</b></div>
 <div class="row"><span>Más goles de un jugador en un partido</span><b>${hat?esc(hat.p)+" · "+hat.n:"—"}</b></div>
 <div class="row"><span>Más partidos jugados</span><b>${spj.length?esc(ties(spj,"pj"))+" · "+spj[0].pj:"—"}</b></div>
 <div class="row"><span>Mejor % de victorias (mín. 2 partidos)</span><b>${pct.length?esc(pct[0].n)+" · "+Math.round(pct[0].w/pct[0].pj*100)+"%":"—"}</b></div></div>`}
async function saveBlob(blob,name){
 try{if(typeof claude!=="undefined"&&claude.use){const d=await claude.use("downloads");if(d){await d.save({filename:name,data:blob});return}}}catch(e){if(e&&e.code=="declined")return}
 try{const f=new File([blob],name,{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Convocatoria"});return}}catch(e){if(e&&e.name=="AbortError")return}
 const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function exportImg(mid){
 const m=S.matches.find(q=>q.id==mid);if(!m)return;

 h+=statsH();
